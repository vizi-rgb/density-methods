[project]
name = "heatmaps-backend"
version = "0.1.0"
description = "Upload videos, analyze them with the density-methods lib, and serve heatmap overlays as HLS."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "filetype>=1.2.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "rq>=2.10.0",
]

[dependency-groups]
dev = [
    "density-methods",
    "fakeredis>=2.37.0",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.uv.sources]
density-methods = { path = "../lib", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Depends"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises the real ML pipeline against a real video (slow).",
]
