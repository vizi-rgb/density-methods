[project]
name = "density-methods"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "lap>=0.5.13",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# core/config/models use bare absolute imports (e.g. `from core.heatmap...`,
# `from config.config_loader import ...`, `from project_root import PROJECT_ROOT`),
# not a `density_methods` namespace package, so they must be exposed as their
# own top-level importable names rather than nested under one package.
[tool.hatch.build.targets.wheel]
packages = ["core", "config", "models"]
include = ["project_root.py"]
